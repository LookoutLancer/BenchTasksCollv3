name: Curate final task pool
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalpool
          fetch-depth: 1
      - name: Remove implementing tasks
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e tasks/finalpool/customer-portal && ! -e tasks/finalpool/sitemap-generator ]]; then
            echo 'Final task pool already curated.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          base = Path('tasks/finalpool')
          manifest = base / '.source_manifest.csv'
          original = manifest.read_text().splitlines()
          removed = {'customer-portal', 'sitemap-generator'}
          rows = [line for line in original if line.split('|')[-1] not in removed]
          assert len(original) == 79 and len(rows) == 77
          manifest.write_text('\n'.join(rows) + '\n')
          readme = '# Final task pool\n\nImplemented tasks selected from Task Tracker. Original branches are recorded in `.source_manifest.csv`.\n\n## Tasks\n\n'
          readme += ''.join(
              f'- `{line.split("|")[-1]}` (developer branch: `{line.split("|")[0]}`)\n'
              for line in rows
          )
          (base / 'README.md').write_text(readme)
          PY
          git rm -r -- tasks/finalpool/customer-portal tasks/finalpool/sitemap-generator
          count=$(find tasks/finalpool -mindepth 1 -maxdepth 1 -type d | wc -l)
          [[ "$count" -eq 77 ]] || { echo "Expected 77 tasks, got $count" >&2; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tasks/finalpool/.source_manifest.csv tasks/finalpool/README.md
          git commit -m 'Curate final pool against Task Tracker implementation status'
          git push origin HEAD:finalpool
